# Synapse homeserver configuration shared by the main process and workers.

server_name: "matrix.local"
public_baseurl: "http://nginx/"
report_stats: false
default_to_encrypted: false

database:
  name: psycopg2
  args:
    user: synapse
    password: 654321
    database: synapse
    host: postgres
    port: 5432
    cp_min: 10
    cp_max: 10

redis:
  enabled: true
  host: redis
  port: 6379

# Authenticate HTTP replication between Synapse processes.
worker_replication_secret: "change-me-worker-replication-secret"

stream_writers:
  events: event_persister
  typing: typing_worker
  to_device: to_device_worker
  account_data: account_data_worker
  receipts: receipts_worker
  presence: presence_worker
  push_rules: push_rules_worker
  device_lists: device_lists_worker

instance_map:
  main:
    host: synapse
    port: 9093
  event_persister:
    host: synapse-event-persister
    port: 9094
  typing_worker:
    host: synapse-typing-worker
    port: 9095
  to_device_worker:
    host: synapse-to-device-worker
    port: 9096
  presence_worker:
    host: synapse-presence-worker
    port: 9097
  receipts_worker:
    host: synapse-receipts-worker
    port: 9098
  push_rules_worker:
    host: synapse-push-rules-worker
    port: 9099
  device_lists_worker:
    host: synapse-device-lists-worker
    port: 9100
  account_data_worker:
    host: synapse-account-data-worker
    port: 9101

listeners:
  - port: 8008
    type: http
    x_forwarded: true
    bind_addresses: ['0.0.0.0']
    resources:
      - names: [client, federation]
        compress: false

  - port: 9093
    type: http
    bind_addresses: ['0.0.0.0']
    resources:
      - names: [replication]
        compress: false

  - port: 9090
    type: http
    bind_addresses: ['0.0.0.0']
    resources:
      - names: [metrics]
        compress: false

logging:
  version: 1
  formatters:
    normal:
      format: '%(asctime)s [%(process)d] %(levelname)-5s %(name)s %(message)s'
  handlers:
    console:
      class: logging.StreamHandler
      formatter: normal
      stream: ext://sys.stdout
  loggers:
    synapse.storage.SQL:
      level: INFO
  root:
    handlers: [console]
    level: INFO

enable_registration: true
registration_requires_token: false
enable_registration_without_verification: true

macaroon_secret_key: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"

rc_login:
  address:
    per_second: 1000
    burst_count: 100000
  account:
    per_second: 1000
    burst_count: 100000
  failed_attempts:
    per_second: 1000
    burst_count: 100000

rc_registration:
  per_second: 1000
  burst_count: 100000

rc_create_room:
  per_second: 1000
  burst_count: 100000

media_store_path: "/data/media_store"
retention:
  enabled: false

use_presence: true

account_validity:
  enabled: false

password_config:
  enabled: true

app_service_config_files: []

tls_certificate_path: null
tls_private_key_path: null
no_tls: true

access_token_lifetime: 24h
sync_response_cache_duration: 2m

# OpenTelemetry/Observability can be set via environment variables.
# OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
