# Synapse Homeserver Configuration Template
# This is a template that will be customized during setup

# The public-facing base URL for the client API (the destination URL that is
# targeted by any requests from clients).
public_baseurl: "http://synapse:8008/"

# The domain of the server, with optional explicit port.
server_name: "matrix.local"

# Report homeserver usage statistics (required setting)
report_stats: false

# When this option is set to true, the new private messages will be stored
# encrypted in the database by default. Defaults to false.
default_to_encrypted: false

# Database configuration
database:
  name: psycopg2
  args:
    user: synapse
    password: 654321
    database: synapse
    host: postgres
    port: 5432
    cp_min: 10
    cp_max: 10

# Redis configuration for caching and replication
redis:
  enabled: true
  host: redis
  port: 6379

# ==========================================
# Worker Configuration
# ==========================================
# The following settings enable Synapse to run with multiple worker processes.
# These workers communicate via HTTP replication and Redis pub/sub.

# Main process instance name (used in instance_map)
instance_map:
  master:
    host: synapse
    port: 9093

# Listeners for client and federation
listeners:
  # Client API listener (main process only, behind nginx)
  - port: 8008
    type: http
    x_forwarded: true
    bind_addresses: ['0.0.0.0']
    resources:
      - names: [client, federation]
        compress: false

  # Replication listener (main process communication with workers)
  - port: 9093
    type: http
    x_forwarded: false
    bind_addresses: ['0.0.0.0']
    resources:
      - names: [replication]
        compress: false

  # Metrics listener
  - port: 9090
    type: http
    bind_addresses: ['0.0.0.0']
    resources:
      - names: [metrics]
        compress: false

# Logging configuration
logging:
  version: 1
  formatters:
    normal:
      format: '%(asctime)s [%(process)d] %(levelname)-5s %(name)s %(message)s'
  handlers:
    console:
      class: logging.StreamHandler
      formatter: normal
      stream: ext://sys.stdout
  loggers:
    synapse.storage.SQL:
      level: INFO
  root:
    handlers: [console]
    level: INFO

# Allow registration of new users without email verification
enable_registration: true
registration_requires_token: false
enable_registration_without_verification: true

# Macaroon secret key (required by Synapse)
macaroon_secret_key: "${MACAROON_SECRET_KEY:-change-me-in-production-0123456789abcdef}"

# Disable rate limiting for load testing by setting very high limits
rc_login:
  address:
    per_second: 1000
    burst_count: 100000
  account:
    per_second: 1000
    burst_count: 100000
  failed_attempts:
    per_second: 1000
    burst_count: 100000

rc_registration:
  per_second: 1000
  burst_count: 100000

rc_create_room:
  per_second: 1000
  burst_count: 100000

# Turn server configuration (optional)
# turn_shared_secret: "your_turn_secret"
# turn_uris:
#   - "turn:your_turn_server"

# Media repository (media files, avatars)
media_store_path: "/data/media_store"

# Retention policy
retention:
  enabled: false

# Signing keys will be automatically generated by Synapse

# Enable presence tracking
use_presence: true

# Account validity and password configuration
account_validity:
  enabled: false

password_config:
  enabled: true

# Appservice configuration (for bridges)
app_service_config_files: []

# TLS configuration (disabled for local testing)
tls_certificate_path: null
tls_private_key_path: null
no_tls: true

# Access token validation
access_token_lifetime: 24h

# Sync timeout
sync_response_cache_duration: 2m

# Workers configuration (optional, for scaling)
# Uncomment the following lines if you want to use workers
# send_federation: false
# federation_sender_instances:
#   - synapse-federation-sender-1

# OpenTelemetry/Observability (optional)
# These can be set via environment variables
# OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
