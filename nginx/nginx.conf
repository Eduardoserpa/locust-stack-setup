events {
    worker_connections 1024;
}

http {
    upstream synapse_generic {
        server synapse:8008 max_fails=5 fail_timeout=60s;
    }

    upstream synapse_federation_send {
        ip_hash;
        server synapse:8008 max_fails=5 fail_timeout=60s;
    }

    upstream synapse_typing_worker {
        server synapse-typing-worker:8084 max_fails=5 fail_timeout=60s;
    }

    upstream synapse_to_device_worker {
        server synapse-to-device-worker:8085 max_fails=5 fail_timeout=60s;
    }

    upstream synapse_presence_worker {
        server synapse-presence-worker:8086 max_fails=5 fail_timeout=60s;
    }

    upstream synapse_receipts_worker {
        server synapse-receipts-worker:8087 max_fails=5 fail_timeout=60s;
    }

    upstream synapse_push_rules_worker {
        server synapse-push-rules-worker:8088 max_fails=5 fail_timeout=60s;
    }

    upstream synapse_device_lists_worker {
        server synapse-device-lists-worker:8089 max_fails=5 fail_timeout=60s;
    }

    upstream synapse_account_data_worker {
        server synapse-account-data-worker:8090 max_fails=5 fail_timeout=60s;
    }

    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=synapse_cache:10m max_size=512m inactive=60m use_temp_path=off;

    server {
        listen 80;
        server_name _;
        client_max_body_size 50M;

        location / {
            root /usr/share/nginx/html;
            try_files $uri @synapse_api;
        }

        location ~ ^/_matrix/client/(api/v1|r0|v3|unstable)/rooms/.*/typing {
            proxy_pass http://synapse_typing_worker;
            proxy_http_version 1.1;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
        }

        location ~ ^/_matrix/client/(r0|v3|unstable)/sendToDevice/ {
            proxy_pass http://synapse_to_device_worker;
            proxy_http_version 1.1;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
        }

        location ~ ^/_matrix/client/(r0|v3|unstable)/.*/(tags|account_data) {
            proxy_pass http://synapse_account_data_worker;
            proxy_http_version 1.1;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
        }

        location ~ ^/_matrix/client/(r0|v3|unstable)/rooms/.*/(receipt|read_markers) {
            proxy_pass http://synapse_receipts_worker;
            proxy_http_version 1.1;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
        }

        location ~ ^/_matrix/client/(api/v1|r0|v3|unstable)/presence/ {
            proxy_pass http://synapse_presence_worker;
            proxy_http_version 1.1;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
        }

        location ~ ^/_matrix/client/(api/v1|r0|v3|unstable)/pushrules/ {
            proxy_pass http://synapse_push_rules_worker;
            proxy_http_version 1.1;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
        }

        location ~ ^/_matrix/client/(r0|v3)/delete_devices$ {
            proxy_pass http://synapse_device_lists_worker;
            proxy_http_version 1.1;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
        }

        location ~ ^/_matrix/client/(api/v1|r0|v3|unstable)/devices(/|$) {
            proxy_pass http://synapse_device_lists_worker;
            proxy_http_version 1.1;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
        }

        location ~ ^/_matrix/client/(r0|v3|unstable)/keys/upload {
            proxy_pass http://synapse_device_lists_worker;
            proxy_http_version 1.1;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
        }

        location ~ ^/_matrix/client/(api/v1|r0|v3|unstable)/keys/(device_signing|signatures)/upload$ {
            proxy_pass http://synapse_device_lists_worker;
            proxy_http_version 1.1;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
        }

        location ~ ^/_matrix/federation/v1/send/ {
            proxy_pass http://synapse_federation_send;
            proxy_http_version 1.1;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
        }

        location @synapse_api {
            proxy_pass http://synapse_generic;
            proxy_http_version 1.1;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        location /_matrix/federation {
            proxy_pass http://synapse_generic;
            proxy_http_version 1.1;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
        }

        location /_matrix/client {
            proxy_pass http://synapse_generic;
            proxy_http_version 1.1;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
        }

        location /_synapse/client {
            proxy_pass http://synapse_generic;
            proxy_http_version 1.1;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
        }

        location /.well-known {
            proxy_pass http://synapse_generic;
            proxy_http_version 1.1;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
        }

        location /_matrix/media {
            proxy_pass http://synapse_generic;
            proxy_http_version 1.1;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_cache synapse_cache;
            proxy_cache_valid 200 60m;
            proxy_cache_key "$scheme$request_method$host$request_uri";
        }

        location /metrics {
            proxy_pass http://synapse:9090/metrics;
            allow 172.16.0.0/12;
            deny all;
        }
    }
}
