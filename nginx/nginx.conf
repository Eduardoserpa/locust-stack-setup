events {
    worker_connections 1024;
}

http {
    # Upstream group for Synapse workers (load balancing)
    upstream synapse_backend {
        # Main process (for some requests)
        server synapse:8008 max_fails=5 fail_timeout=60s;
        # Generic workers (handle client requests)
        server synapse-worker-1:8081 max_fails=5 fail_timeout=60s;
        server synapse-worker-2:8082 max_fails=5 fail_timeout=60s;
    }

    # Cache configuration
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=synapse_cache:10m max_size=512m inactive=60m use_temp_path=off;

    server {
        listen 80;
        server_name _;
        client_max_body_size 50M;

        # Root location - serve static files if available
        location / {
            root /usr/share/nginx/html;
            try_files $uri @synapse_api;
        }

        # Matrix client API endpoints
        location @synapse_api {
            proxy_pass http://synapse_backend;
            proxy_http_version 1.1;
            
            # Set forwarded headers for Synapse to recognize proxied connections
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $server_name;
            
            # Essential headers
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            
            # Connection settings
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Matrix federation API
        location /_matrix/federation {
            proxy_pass http://synapse_backend;
            proxy_http_version 1.1;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $server_name;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
        }

        # Matrix client API - sync endpoint (no caching, long-polling)
        location /_matrix/client/r0/sync {
            proxy_pass http://synapse_backend;
            proxy_http_version 1.1;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $server_name;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            # Don't cache sync requests (they're long-polling)
        }

        # Matrix client API (general)
        location /_matrix/client {
            proxy_pass http://synapse_backend;
            proxy_http_version 1.1;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $server_name;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
        }

        # Synapse synced resources (well-known, media, etc.)
        location /.well-known {
            proxy_pass http://synapse_backend;
            proxy_http_version 1.1;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $server_name;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
        }

        # Media repository
        location /_matrix/media {
            proxy_pass http://synapse_backend;
            proxy_http_version 1.1;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $server_name;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            # Cache media files
            proxy_cache synapse_cache;
            proxy_cache_valid 200 60m;
            proxy_cache_key "$scheme$request_method$host$request_uri";
        }

        # Metrics endpoint (only from localhost for security)
        location /metrics {
            proxy_pass http://synapse:9090/metrics;
            allow 172.17.0.0/12;  # Docker network range
            deny all;
        }
    }
}
