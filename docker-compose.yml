# Docker Compose file for Matrix Synapse + Locust + OpenTelemetry Stack
# This orchestrates Synapse homeserver, Matrix Locust load tester, and OpenTelemetry collector
# for local testing and observability

# Shared network for all services
networks:
  matrix-network:
    name: matrix-network
    driver: bridge

services:
  # ==========================================
  # Core Services - Matrix Synapse
  # ==========================================

  # PostgreSQL database for Synapse
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    container_name: synapse-postgres
    restart: unless-stopped
    networks:
      - matrix-network
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-synapse}
      POSTGRES_USER: ${POSTGRES_USER:-synapse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-654321}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
    volumes:
      - ${PWD}/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-synapse}"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    logging:
      driver: ${LOGS_DRIVER:-json-file}
      options:
        max-size: ${LOGS_MAX_SIZE:-5m}
        max-file: ${LOGS_MAX_FILE:-2}

  # Redis cache for Synapse (recommended for performance)
  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    container_name: synapse-redis
    restart: unless-stopped
    networks:
      - matrix-network
    volumes:
      - ${PWD}/data/redis:/data
    command: redis-server --bind 0.0.0.0
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -h 127.0.0.1 ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "6379:6379"
    logging:
      driver: ${LOGS_DRIVER:-json-file}
      options:
        max-size: ${LOGS_MAX_SIZE:-5m}
        max-file: ${LOGS_MAX_FILE:-2}
  # Nginx reverse proxy (optional, can be used for TLS termination or routing)
  nginx:
    image: nginx:alpine # Use the lightweight alpine image
    container_name: synapse-nginx
    ports:
      - "80:80" # Map port 80 on the host to port 80 in the container
    networks:
      - matrix-network
    volumes:
      # Mount local nginx.conf to the container's config path
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Mount local html directory to the container's web root
      - ./html:/usr/share/nginx/html:ro
    restart: unless-stopped
    depends_on:
      synapse:
        condition: service_healthy
      synapse-event-persister:
        condition: service_healthy
      synapse-typing-worker:
        condition: service_healthy
      synapse-to-device-worker:
        condition: service_healthy
      synapse-presence-worker:
        condition: service_healthy
      synapse-receipts-worker:
        condition: service_healthy
      synapse-push-rules-worker:
        condition: service_healthy
      synapse-device-lists-worker:
        condition: service_healthy
      synapse-account-data-worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep -q '[n]ginx' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: ${LOGS_DRIVER:-json-file}
      options:
        max-size: ${LOGS_MAX_SIZE:-5m}
        max-file: ${LOGS_MAX_FILE:-2}
  # Synapse homeserver
  synapse:
    build:
      context: .
      dockerfile: ./config/synapse/Dockerfile.custom
    image: ${SYNAPSE_IMAGE:-matrixdotorg/synapse:latest}
    container_name: synapse-homeserver
    user: "${SYNAPSE_UID:-1000}:${SYNAPSE_GID:-1000}"
    restart: unless-stopped
    networks:
      - matrix-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    environment:
      SYNAPSE_CONFIG_DIR: ${SYNAPSE_CONFIG_DIR:-/conf}
      SYNAPSE_CONFIG_PATH: ${SYNAPSE_CONFIG_PATH:-/conf/homeserver.yaml}
      SYNAPSE_SERVER_NAME: ${SYNAPSE_SERVER_NAME:-matrix.local}
      SYNAPSE_REPORT_STATS: ${SYNAPSE_REPORT_STATS:-no}
      MACAROON_SECRET_KEY: ${MACAROON_SECRET_KEY:-change-me-in-production}
      # OpenTelemetry configuration (optional)
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: synapse
      OTEL_RESOURCE_ATTRIBUTES: service.name=synapse,service.namespace=matrix-local
    volumes:
      - ${PWD}/data/synapse:/data
      - ${PWD}/config/synapse:/conf
    ports:
      - "${SYNAPSE_PORT:-8008}:8008"
      - "${SYNAPSE_METRICS_PORT:-9090}:9090"
    expose:
      - "9093"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8008/_matrix/client/versions || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: ${LOGS_DRIVER:-json-file}
      options:
        max-size: ${LOGS_MAX_SIZE:-5m}
        max-file: ${LOGS_MAX_FILE:-2}

  # ==========================================
  # Specialized Workers
  # ==========================================

  # Event Persister Worker - Handles 'events' stream
  synapse-event-persister:
    build:
      context: .
      dockerfile: ./config/synapse/Dockerfile.custom
    image: ${SYNAPSE_IMAGE:-matrixdotorg/synapse:latest}
    container_name: synapse-event-persister
    user: "${SYNAPSE_UID:-1000}:${SYNAPSE_GID:-1000}"
    restart: unless-stopped
    networks:
      - matrix-network
    depends_on:
      synapse:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SYNAPSE_WORKER: synapse.app.generic_worker
      SYNAPSE_CONFIG_DIR: ${SYNAPSE_CONFIG_DIR:-/conf}
      SYNAPSE_SERVER_NAME: ${SYNAPSE_SERVER_NAME:-matrix.local}
      MACAROON_SECRET_KEY: ${MACAROON_SECRET_KEY:-change-me-in-production}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: synapse-event-persister
    volumes:
      - ${PWD}/data/synapse:/data
      - ${PWD}/config/synapse:/conf
    command: ["run", "-m", "synapse.app.generic_worker", "--config-path", "/conf/homeserver.yaml", "--config-path", "/conf/event_persister.yaml"]
    expose:
      - "9094"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.create_connection(('127.0.0.1', 9094), 5); s.close()\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s
    logging:
      driver: ${LOGS_DRIVER:-json-file}
      options:
        max-size: ${LOGS_MAX_SIZE:-5m}
        max-file: ${LOGS_MAX_FILE:-2}

