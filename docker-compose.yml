      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SYNAPSE_WORKER: synapse.app.generic_worker
      SYNAPSE_CONFIG_DIR: ${SYNAPSE_CONFIG_DIR:-/conf}
      SYNAPSE_SERVER_NAME: ${SYNAPSE_SERVER_NAME:-matrix.local}
      MACAROON_SECRET_KEY: ${MACAROON_SECRET_KEY:-change-me-in-production}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: synapse-receipts-worker
    volumes:
      - ${PWD}/data/synapse:/data
      - ${PWD}/config/synapse:/conf
    command: ["run", "-m", "synapse.app.generic_worker", "--config-path", "/conf/homeserver.yaml", "--config-path", "/conf/receipts_worker.yaml"]
    expose:
      - "8087"
      - "9098"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8087/_matrix/client/versions || exit 1"]
